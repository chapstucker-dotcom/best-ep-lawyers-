name: Deploy to Vercel

on:
  workflow_dispatch:  # manual trigger only - Vercel's native GitHub integration handles auto-deploys

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: 'EP BEST LAWYERS'

      - name: Build (Vite)
        run: npm run build
        working-directory: 'EP BEST LAWYERS'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        run: >
          vercel deploy --prod --yes
          --token=${{ secrets.VERCEL_TOKEN }}
          --name=best-ep-lawyers
          -e VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          -e VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
        working-directory: 'EP BEST LAWYERS'
